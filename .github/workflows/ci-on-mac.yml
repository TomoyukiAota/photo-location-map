name: CI on macOS

on:
  push:
    branches:
      - '**'    # matches every branch
  pull_request:
    branches:
      - main
  workflow_dispatch:    # to run on macos-26-intel on demand (see the test job below)

jobs:
  changes:
    # Finds out whether anything other than documents changed (see .github/ci-filters.yml).
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
    - uses: actions/checkout@v7

    - uses: dorny/paths-filter@v4
      id: filter
      with:
        predicate-quantifier: every
        filters: .github/ci-filters.yml

  test:
    # macos-26 is arm64 (Apple Silicon), and runs on every push and pull request.
    # macos-26-intel is x64, and runs only when this workflow is run manually, because it took twice as long as macos-26
    # and its failures were caused by the runner, not the app. See CLAUDE.md for when to run it.
    # The name is given here rather than by a matrix, so that the required check is reported even when the job is skipped.
    name: ${{ github.event_name == 'workflow_dispatch' && 'test (macos-26-intel)' || 'test (macos-26)' }}
    runs-on: ${{ github.event_name == 'workflow_dispatch' && 'macos-26-intel' || 'macos-26' }}

    # Skipped when only documents changed, which passes the required check, unless this workflow is run manually.
    # If "changes" fails, the tests run.
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.app != 'false') }}

    # The timeout below is to bound the duration of a hung job.
    # This job once hung in "npm run test:package" and kept running for more than 40 minutes until it was cancelled manually.
    # This job takes about 20 minutes at the longest on macos-26-intel, so the timeout below has enough margin.
    timeout-minutes: 45

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # for electron-builder

    steps:
    - uses: actions/checkout@v7

    - name: Install Node.js with the version in mise.toml
      uses: jdx/mise-action@v4

    - name: npm ci
      run: npm ci

    - name: npm run lint:ng
      run: npm run lint:ng

    - name: npm run lint:script
      run: npm run lint:script

    - name: npm run test:unit:ng
      run: npm run test:unit:ng

    - name: npm run test:unit:em:main
      run: npm run test:unit:em:main

    - name: npm run test:unit:em:renderer
      run: npm run test:unit:em:renderer

    - name: npm run test:package
      run: npm run test:package
