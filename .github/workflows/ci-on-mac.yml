name: CI on macOS

on:
  push:
    branches:
      - '**'    # matches every branch
  # No pull_request trigger: each commit is tested by its push run alone, and a pull request from a fork by
  # ci-on-fork-pull-request.yml, which calls this workflow (AGENTS.md, "CI tests each commit once, on push").
  workflow_call:
  # On demand: to run on macos-26-intel (see the test-intel job below), or to write the screenshot references anew.
  workflow_dispatch:
    inputs:
      update_screenshots:
        description: Write anew the screenshot references of macos-26 that differ, and upload them (test/e2e/README.md)
        type: boolean
        default: false

# A new commit on a branch cancels the runs of the commit before it, so that only the latest commit is tested when
# Mergify brings a pull request up to date with main (.mergify.yml). Each run on main, and each run started by hand,
# has a group of its own, and is never canceled. The group names this workflow itself rather than github.workflow,
# which is the caller's name when ci-on-fork-pull-request.yml calls it, so that the three workflows that it calls do
# not share one.
concurrency:
  group: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && github.run_id || format('CI on macOS {0} {1}', github.event_name, github.event.pull_request.number || github.ref_name) }}
  cancel-in-progress: true

jobs:
  changes:
    # Finds out whether anything other than documents changed (see .github/ci-filters.yml).
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
    - uses: actions/checkout@v7.0.1

    - uses: dorny/paths-filter@v4.0.3
      id: filter
      with:
        predicate-quantifier: every
        filters: .github/ci-filters.yml


  part-1:
    # TL;DR: The tests on macos-26, which is arm64 (Apple Silicon), in two parts that run at once, each on a runner of
    # its own. Each part makes the package and runs half of the e2e suite against it; part 1 also runs the checks and the
    # unit tests. The job "test" below reports both as the required check "test (macos-arm64)".
    # Details: In one job, the e2e suite took about 10 minutes after about 9 for the rest, and the job bounded each cycle
    # of CI with Windows'. PLM_E2E_SHARD names the half of the suite (test/e2e/playwright.config.mjs). PLM_CI_PART
    # leaves out of part 2 what part 1 runs alone, and test-intel, which has no part, runs everything.
    # The names are written out rather than given by a matrix or an expression, so that the checks are reported even
    # when the jobs are skipped: a skipped job's name expression is not evaluated.
    name: test (macos-arm64), part 1 of 2
    runs-on: macos-26

    # Skipped when only documents changed. If "changes" fails, the tests run.
    # A manual run runs this job too, so that it does not add a skipped "test (macos-arm64)" to the commit.
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.app != 'false') }}

    # The timeout below is to bound the duration of a hung job.
    # This job once hung in "npm run test:package" and kept running for more than 40 minutes until it was cancelled manually.
    # This job takes about 20 minutes at the longest on macos-26-intel, so the timeout below has enough margin.
    timeout-minutes: 45

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # for electron-builder
      PLM_CI_PART: '1'
      # A run that writes the screenshot references anew runs the whole suite in this part, so that one artifact holds
      # all of them.
      PLM_E2E_SHARD: ${{ !inputs.update_screenshots && '1/2' || '' }}

    steps: &steps
    - uses: actions/checkout@v7.0.1

    - name: Install Node.js with the version in mise.toml
      uses: jdx/mise-action@v5.2.5

    - name: Verify Node and its bundled npm
      run: npm run verify:runtime

    - name: npm ci
      run: npm ci

    - name: Verify Electron and embedded Node
      run: npm run verify:electron

    # From here to "npm run test:live-reload", the steps run in part 1, and in test-intel, which has no part.
    - name: npm run test:dependency-compat
      if: ${{ env.PLM_CI_PART != '2' }}
      run: npm run test:dependency-compat

    - name: npm run test:website
      if: ${{ env.PLM_CI_PART != '2' }}
      run: npm run test:website

    - name: npm run lint:ng
      if: ${{ env.PLM_CI_PART != '2' }}
      run: npm run lint:ng

    - name: npm run lint:main
      if: ${{ env.PLM_CI_PART != '2' }}
      run: npm run lint:main

    - name: npm run lint:script
      if: ${{ env.PLM_CI_PART != '2' }}
      run: npm run lint:script

    - name: npm run test:unit:ng
      if: ${{ env.PLM_CI_PART != '2' }}
      run: npm run test:unit:ng

    - name: npm run test:unit:em:main
      if: ${{ env.PLM_CI_PART != '2' }}
      run: npm run test:unit:em:main

    - name: npm run test:unit:em:renderer
      if: ${{ env.PLM_CI_PART != '2' }}
      run: npm run test:unit:em:renderer

    - name: npm run test:live-reload
      if: ${{ env.PLM_CI_PART != '2' }}
      run: npm run test:live-reload

    - name: npm run test:package
      run: npm run test:package

    - name: npm run test:e2e
      # Part 2 has no half of the suite to run in a run that writes the screenshot references anew (see part-1's env).
      if: ${{ !inputs.update_screenshots || env.PLM_CI_PART != '2' }}
      env:
        # The screenshot comparisons too, on arm64 only, against the references that CI keeps for its runner, whose
        # macOS sets text differently from the Mac that snapshots/ matches (test/e2e/README.md). test-intel runs these
        # steps as well.
        PLM_VISUAL: ${{ runner.arch == 'ARM64' && '1' || '' }}
        PLM_VISUAL_REFERENCES: ${{ runner.arch == 'ARM64' && 'snapshots-ci/macos-26-arm64' || '' }}
      # Against a copy of the package whose fuse enableNodeCliInspectArguments is on: Playwright controls the application
      # through Node's inspector, which the package does not start (script/package-test/inspectable-package.js).
      # With update_screenshots, the references that differ are written anew rather than failed on.
      run: |
        executable="$(node script/package-test/inspectable-package.js)"
        export PLM_PACKAGED_EXECUTABLE="$executable"
        npm run test:e2e ${{ inputs.update_screenshots && '-- --update-snapshots=changed' || '' }}

    - name: Upload the screenshot references written anew
      if: ${{ !cancelled() && inputs.update_screenshots && runner.arch == 'ARM64' && env.PLM_CI_PART != '2' }}
      uses: actions/upload-artifact@v7.0.2
      with:
        name: screenshots-macos-26-arm64
        path: test/e2e/snapshots-ci/macos-26-arm64
        if-no-files-found: error

    - name: Upload the e2e results of a failure
      # Playwright writes there what a failed case saw, such as a screenshot and its difference from the reference.
      if: ${{ failure() }}
      uses: actions/upload-artifact@v7.0.2
      with:
        name: e2e-results-macos-${{ runner.arch }}${{ env.PLM_CI_PART && format('-part-{0}', env.PLM_CI_PART) || '' }}
        path: .upgrade-artifacts/e2e-results
        if-no-files-found: ignore

  part-2:
    # See part-1.
    name: test (macos-arm64), part 2 of 2
    runs-on: macos-26
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.app != 'false') }}
    timeout-minutes: 45    # See part-1.
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # for electron-builder
      PLM_CI_PART: '2'
      PLM_E2E_SHARD: '2/2'
    steps: *steps

  test:
    # The required check of macos-26: it passes when both parts passed. When only documents changed, it is skipped with
    # them, which passes the check too. It only reads their results, so it runs on Ubuntu rather than wait for a macOS
    # runner. Keep architecture-specific check names stable when runner versions change.
    name: test (macos-arm64)
    runs-on: ubuntu-26.04
    needs: [changes, part-1, part-2]
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.app != 'false') }}
    timeout-minutes: 5
    steps:
    - name: Check that both parts passed
      run: |
        echo "Part 1 of 2: ${{ needs.part-1.result }}. Part 2 of 2: ${{ needs.part-2.result }}."
        if [ "${{ needs.part-1.result }}" != success ] || [ "${{ needs.part-2.result }}" != success ]; then
          echo "::error::Read the log of the part that did not pass, which is a job of its own in this run."
          exit 1
        fi

  test-intel:
    # macos-26-intel is x64, and runs only when this workflow is run manually, because it took twice as long as macos-26
    # and its failures were caused by the runner, not the app. See AGENTS.md for when to run it. A manual run that
    # writes the screenshot references anew leaves it out. It runs the steps of both parts in one job, the whole e2e
    # suite included, as it has neither PLM_CI_PART nor PLM_E2E_SHARD.
    name: test (macos-x64)
    runs-on: macos-26-intel
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.update_screenshots }}
    timeout-minutes: 45    # See part-1.
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # for electron-builder
    steps: *steps
