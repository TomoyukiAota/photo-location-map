name: CI on Windows

on:
  push:
    branches:
      - '**'    # matches every branch
  pull_request:
    branches:
      - main

jobs:
  changes:
    # Finds out whether anything other than documents changed (see .github/ci-filters.yml).
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
    - uses: actions/checkout@v7.0.1

    - uses: dorny/paths-filter@v4.0.3
      id: filter
      with:
        predicate-quantifier: every
        filters: .github/ci-filters.yml

  test:
    # The name is given here rather than by a matrix, so that the required check is reported even when the job is skipped.
    name: test (windows-latest)
    runs-on: windows-latest

    # Skipped when only documents changed, which passes the required check. If "changes" fails, the tests run.
    # The publish steps below are skipped with it, since documents cannot break publishing.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}

    # The timeout below is a preventative measure to bound the duration of a hung job.
    # This job usually takes about 10 minutes, so the timeout below has enough margin.
    timeout-minutes: 30

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # for electron-builder

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Install Node.js with the version in mise.toml
      uses: jdx/mise-action@v5.2.5

    - name: npm ci
      run: npm ci

    - name: npm run lint:ng
      run: npm run lint:ng

    - name: npm run lint:script
      run: npm run lint:script

    - name: npm run test:unit:ng
      run: npm run test:unit:ng

    - name: npm run test:unit:em:main
      run: npm run test:unit:em:main

    - name: npm run test:unit:em:renderer
      run: npm run test:unit:em:renderer

    - name: npm run test:package
      run: npm run test:package

    - name: npm run test:e2e
      run: npm run test:e2e

    - name: '[Publish to GitHub Releases] Clean-up by "git clean -fdx" (1st time)'
      run: git clean -fdx

    - name: '[Publish to GitHub Releases] Clean-up by "git clean -fdx" (2nd time to be sure)'
      run: git clean -fdx

    - name: '[Publish to GitHub Releases] npm ci'
      run: npm ci

    - name: '[Publish to GitHub Releases] Create and publish Windows package'
      uses: nick-fields/retry@v4.0.0
      with:
        timeout_minutes: 60
        max_attempts: 10
        retry_on: error
        command: npm run publish:windows      # To publish, GH_TOKEN environment variable needs to be set.
