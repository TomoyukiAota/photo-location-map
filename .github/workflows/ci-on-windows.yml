name: CI on Windows

on:
  push:
    branches:
      - '**'    # matches every branch
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ${{ matrix.os }}

    # "npm run test:package" runs commands without a timeout, and it hangs when one of them does not return.
    # Without the setting below, such a job keeps running until the default timeout of GitHub Actions, which is 6 hours.
    # This job takes about 9 minutes including the publish step, so the timeout below has enough margin.
    # Note that the retry of the publish step below can take longer than this timeout in theory, but it takes about 2 minutes in practice.
    timeout-minutes: 30

    strategy:
      matrix:
        os: [windows-latest]

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # for electron-builder

    steps:
    - uses: actions/checkout@v7

    - name: Install Node.js with the version in mise.toml
      uses: jdx/mise-action@v4

    - name: npm ci
      run: npm ci

    - name: npm run lint:ng
      run: npm run lint:ng

    - name: npm run lint:script
      run: npm run lint:script

    - name: npm run test:unit:ng
      run: npm run test:unit:ng

    - name: npm run test:unit:em:main
      run: npm run test:unit:em:main

    - name: npm run test:unit:em:renderer
      run: npm run test:unit:em:renderer

    - name: npm run test:package
      run: npm run test:package

    - name: '[Publish to GitHub Releases] Clean-up by "git clean -fdx" (1st time)'
      run: git clean -fdx

    - name: '[Publish to GitHub Releases] Clean-up by "git clean -fdx" (2nd time to be sure)'
      run: git clean -fdx

    - name: '[Publish to GitHub Releases] npm ci'
      run: npm ci

    - name: '[Publish to GitHub Releases] Create and publish Windows package'
      uses: nick-invision/retry@v2.2.0
      with:
        timeout_minutes: 60
        max_attempts: 10
        retry_on: error
        command: npm run publish:windows      # To publish, GH_TOKEN environment variable needs to be set.
