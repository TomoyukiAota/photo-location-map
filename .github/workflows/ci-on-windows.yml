name: CI on Windows

# Probe, not to be merged: always skipped, so that only test (ubuntu) decides.
on:
  push:
    branches:
      - '**'    # matches every branch
  workflow_call:

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && github.run_id || format('CI on Windows {0} {1}', github.event_name, github.event.pull_request.number || github.ref_name) }}
  cancel-in-progress: true

jobs:
  test:
    name: test (windows-latest)
    runs-on: windows-latest
    if: false
    steps:
    - run: exit 0
