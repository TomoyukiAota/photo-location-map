name: CI on Windows

on:
  push:
    branches:
      - '**'    # matches every branch
  # No pull_request trigger: each commit is tested by its push run alone, and a pull request from a fork by
  # ci-on-fork-pull-request.yml, which calls this workflow (AGENTS.md, "CI tests each commit once, on push").
  workflow_call:

# A new commit on a branch cancels the runs of the commit before it, so that only the latest commit is tested, as when
# Mergify's merge queue makes a branch mergify/merge-queue/… anew (.mergify.yml). Each run on main has a group of its
# own, and is never canceled. The group names this workflow itself rather than github.workflow, which is the caller's
# name when ci-on-fork-pull-request.yml calls it, so that the three workflows that it calls do not share one.
# A push's run that is canceled while it publishes leaves the files that it uploaded in the draft release, and the next
# run that publishes replaces them: electron-publish deletes a file that the draft release already has, and uploads it
# again (overwriteArtifact of its GitHubPublisher). The run of a pull request from a fork (ci-on-fork-pull-request.yml)
# does not publish.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && github.run_id || format('CI on Windows {0} {1}', github.event_name, github.event.pull_request.number || github.ref_name) }}
  cancel-in-progress: true

jobs:
  changes:
    # Finds out whether anything other than documents changed (see .github/ci-filters.yml).
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
    - uses: actions/checkout@v7.0.1

    - uses: dorny/paths-filter@v4.0.3
      id: filter
      with:
        predicate-quantifier: every
        filters: .github/ci-filters.yml

  part-1:
    # TL;DR: The tests on Windows, in two parts that run at once, each on a runner of its own. Each part makes and
    # installs the package and runs half of the e2e suite against it; part 1 also runs the checks, the unit tests and the
    # uninstaller test, and part 2 publishes. The job "test" below reports both as the required check
    # "test (windows-latest)".
    # Details: In one job, the e2e suite took about 9 minutes after about 7 for the rest, and the publishing about 4
    # more. PLM_E2E_SHARD names the half of the suite (test/e2e/playwright.config.mjs), and PLM_CI_PART leaves out of
    # each part what the other runs alone.
    # The names are written out rather than given by a matrix or an expression, so that the checks are reported even
    # when the jobs are skipped: a skipped job's name expression is not evaluated.
    name: test (windows-latest), part 1 of 2
    runs-on: windows-latest

    # Skipped when only documents changed. If "changes" fails, the tests run.
    # The publish steps are skipped with part 2, since documents cannot break publishing.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}

    # The timeout below is a preventative measure to bound the duration of a hung job.
    # This job usually takes about 12 minutes, so the timeout below has enough margin.
    timeout-minutes: 30

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # for electron-builder
      PLM_CI_PART: '1'
      PLM_E2E_SHARD: '1/2'

    steps: &steps
    - uses: actions/checkout@v7.0.1

    - name: Install Node.js with the version in mise.toml
      uses: jdx/mise-action@v5.2.5

    - name: Verify Node and its bundled npm
      run: npm run verify:runtime

    - name: npm ci
      run: npm ci

    - name: Verify Electron and embedded Node
      run: npm run verify:electron

    # From here to "npm run test:live-reload", the steps run in part 1 only.
    - name: npm run test:dependency-compat
      if: ${{ env.PLM_CI_PART != '2' }}
      run: npm run test:dependency-compat

    - name: npm run test:website
      if: ${{ env.PLM_CI_PART != '2' }}
      run: npm run test:website

    - name: npm run lint:ng
      if: ${{ env.PLM_CI_PART != '2' }}
      run: npm run lint:ng

    - name: npm run lint:main
      if: ${{ env.PLM_CI_PART != '2' }}
      run: npm run lint:main

    - name: npm run lint:script
      if: ${{ env.PLM_CI_PART != '2' }}
      run: npm run lint:script

    - name: npm run test:unit:ng
      if: ${{ env.PLM_CI_PART != '2' }}
      run: npm run test:unit:ng

    - name: npm run test:unit:em:main
      if: ${{ env.PLM_CI_PART != '2' }}
      run: npm run test:unit:em:main

    - name: npm run test:unit:em:renderer
      if: ${{ env.PLM_CI_PART != '2' }}
      run: npm run test:unit:em:renderer

    # TL;DR: Check that the Electron-Mocha suites start from a checkout whose path contains a space, which
    # script/patch-electron-mocha.js makes possible. This job's own checkout path has no space.
    # Details: Electron-Mocha 13.1.0 starts Electron through cmd.exe on Windows, and Node passes the Electron path
    # to it unquoted, so without the patch the path splits at the space. A second checkout at such a path is
    # installed with a clean "npm ci", as a developer would. When an Electron-Mocha release stops using a shell at
    # both patched sites, remove the patch and keep this step to confirm that the suites still start. This step
    # does not see the quit hook's detached cleanup, so check that site in the release's source
    # (see "Departures kept for a needed feature" in docs/contributing/dependencies.md).
    - name: npm run test:unit:em:main and test:unit:em:renderer from a checkout path with a space
      if: ${{ env.PLM_CI_PART != '2' }}
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        $checkout = Join-Path $env:RUNNER_TEMP 'checkout with spaces'
        git worktree add --detach $checkout HEAD
        Set-Location $checkout
        npm ci
        npm run verify:electron
        npm run test:unit:em:main
        npm run test:unit:em:renderer

    - name: npm run test:live-reload
      if: ${{ env.PLM_CI_PART != '2' }}
      run: npm run test:live-reload

    - name: npm run test:package
      id: package-test
      run: npm run test:package

    - name: npm run test:e2e
      # Against a copy of the installed application whose fuse enableNodeCliInspectArguments is on: Playwright controls
      # the application through Node's inspector, which the package does not start
      # (script/package-test/inspectable-package.js).
      run: |
        $env:PLM_PACKAGED_EXECUTABLE = node script/package-test/inspectable-package.js
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        npm run test:e2e

    - name: npm run test:uninstaller
      # After the e2e suite, which runs its copy of the installed application: this reinstalls over and then
      # uninstalls the application that the package test installed, and checks that build/installer.nsh deletes the
      # Explorer context menu on uninstall, without stopping at a key that it cannot delete, and keeps it on an update
      # (script/package-test/uninstaller-test.js).
      # It runs when only the e2e suite failed, as the suite cannot change the installation. In part 1 only.
      if: ${{ !cancelled() && steps.package-test.outcome == 'success' && env.PLM_CI_PART != '2' }}
      timeout-minutes: 6
      env:
        PLM_UNINSTALLER_TEST: 'true'
      run: npm run test:uninstaller

    # The publish steps run in part 2 only, after its half of the e2e suite: on every push (AGENTS.md, "The Windows CI
    # publishes on purpose").
    - name: '[Publish to GitHub Releases] Clean-up by "git clean -fdx" (1st time)'
      if: ${{ env.PLM_CI_PART != '1' }}
      run: git clean -fdx

    - name: '[Publish to GitHub Releases] Clean-up by "git clean -fdx" (2nd time to be sure)'
      if: ${{ env.PLM_CI_PART != '1' }}
      run: git clean -fdx

    - name: '[Publish to GitHub Releases] npm ci'
      if: ${{ env.PLM_CI_PART != '1' }}
      run: npm ci

    - name: '[Publish to GitHub Releases] Create and publish Windows package'
      if: ${{ env.PLM_CI_PART != '1' }}
      uses: nick-fields/retry@v4.0.0
      with:
        timeout_minutes: 60
        max_attempts: 10
        retry_on: error
        command: npm run publish:windows      # To publish, GH_TOKEN environment variable needs to be set.

  part-2:
    # See part-1.
    name: test (windows-latest), part 2 of 2
    runs-on: windows-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    timeout-minutes: 30    # See part-1. This job usually takes about 13 minutes.
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # for electron-builder
      PLM_CI_PART: '2'
      PLM_E2E_SHARD: '2/2'
    steps: *steps

  test:
    # The required check of Windows: it passes when both parts passed. When only documents changed, it is skipped with
    # them, which passes the check too. It only reads their results, so it runs on Ubuntu.
    name: test (windows-latest)
    runs-on: ubuntu-26.04
    needs: [changes, part-1, part-2]
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    timeout-minutes: 5
    steps:
    - name: Check that both parts passed
      run: |
        echo "Part 1 of 2: ${{ needs.part-1.result }}. Part 2 of 2: ${{ needs.part-2.result }}."
        if [ "${{ needs.part-1.result }}" != success ] || [ "${{ needs.part-2.result }}" != success ]; then
          echo "::error::Read the log of the part that did not pass, which is a job of its own in this run."
          exit 1
        fi
