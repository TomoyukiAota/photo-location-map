name: CI on Ubuntu

on:
  push:
    branches:
      - '**'    # matches every branch
  pull_request:
    branches:
      - main

jobs:
  test:
    # Probe, not to be merged: fails on push after 5 minutes, and is skipped for a pull request from this repository,
    # to see whether the skipped check of the pull request's run counts over the push run's pending or failed one.
    name: test (ubuntu)
    runs-on: ubuntu-26.04
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository }}
    timeout-minutes: 10
    steps:
    - run: sleep 300; exit 1
