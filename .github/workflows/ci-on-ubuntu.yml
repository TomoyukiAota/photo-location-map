name: CI on Ubuntu

on:
  push:
    branches:
      - '**'    # matches every branch
  pull_request:
    branches:
      - main

jobs:
  changes:
    # Finds out whether anything other than documents changed (see .github/ci-filters.yml).
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
    - uses: actions/checkout@v7.0.1

    - uses: dorny/paths-filter@v4.0.3
      id: filter
      with:
        predicate-quantifier: every
        filters: .github/ci-filters.yml

  test:
    # The name is given here rather than by a matrix, so that the required check is reported even when the job is skipped.
    # Keep the required-check name stable when the Ubuntu runner version changes.
    name: test (ubuntu)
    runs-on: ubuntu-26.04

    # Skipped when only documents changed, which passes the required check. If "changes" fails, the tests run.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}

    # The timeout below is a preventative measure to bound the duration of a hung job.
    # This job usually takes about 12 minutes, so the timeout below has enough margin.
    timeout-minutes: 30

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # for electron-builder
      ELECTRON_DISABLE_SANDBOX: '1'

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Install Node.js with the version in mise.toml
      uses: jdx/mise-action@v5.2.5

    - name: Verify Node and its bundled npm
      run: npm run verify:runtime

    - name: npm ci
      run: npm ci

    - name: Verify Electron and embedded Node
      run: npm run verify:electron

    - name: npm run test:dependency-compat
      run: npm run test:dependency-compat

    - name: Install virtual display dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb x11-xserver-utils

    - name: npm run lint:ng
      run: npm run lint:ng

    - name: npm run lint:main
      run: npm run lint:main

    - name: npm run lint:script
      run: npm run lint:script

    - name: npm run test:unit:ng
      run: xvfb-run --auto-servernum npm run test:unit:ng

    - name: npm run test:unit:em:main
      run: xvfb-run --auto-servernum npm run test:unit:em:main

    - name: npm run test:unit:em:renderer
      run: xvfb-run --auto-servernum npm run test:unit:em:renderer

    - name: npm run test:live-reload
      run: xvfb-run --auto-servernum npm run test:live-reload

    - name: Install FUSE (Required to launch AppImage during "npm run test:package")
      run: |
        sudo apt-get update
        sudo apt-get install -y libfuse2t64

    - name: npm run test:package
      run: xvfb-run --auto-servernum npm run test:package

    - name: Make an AppImage for E2E
      # Of a copy of the package whose fuse enableNodeCliInspectArguments is on: Playwright controls the application
      # through Node's inspector, which the package does not start (script/package-test/inspectable-package.js).
      run: |
        executable="$(node script/package-test/inspectable-package.js)"
        echo "PLM_PACKAGED_EXECUTABLE=$executable" >> "$GITHUB_ENV"

    - name: npm run test:e2e
      run: xvfb-run --auto-servernum npm run test:e2e

    - name: npm run build:dev
      run: npm run build:dev

    - name: npm run test:e2e against the development build
      # A development build checks every view each second for a binding that changed without telling Angular, which
      # would not be rendered, and the suite fails a case that logged one, as NG0100 (test/e2e/README.md). The AppImage
      # above is a production build, which checks nothing. This job, the shortest, runs it: it takes about 5 minutes
      # more, and the Windows job still takes longer. PLM_PACKAGED_EXECUTABLE, which "Make an AppImage for E2E"
      # set, is unset so that the suite runs the checkout.
      run: env -u PLM_PACKAGED_EXECUTABLE xvfb-run --auto-servernum npm run test:e2e

