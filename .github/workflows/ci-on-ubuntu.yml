name: CI on Ubuntu

# Probe, not to be merged: "changes" is held back, 10 minutes on push and not at all when ci-on-fork-pull-request.yml
# calls this workflow, so that the push run's test (ubuntu) has no check run yet while the called one has passed.
on:
  push:
    branches:
      - '**'    # matches every branch
  workflow_call:

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && github.run_id || format('CI on Ubuntu {0} {1}', github.event_name, github.event.pull_request.number || github.ref_name) }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-26.04
    outputs:
      app: 'true'
    steps:
    - run: sleep ${{ github.event_name == 'push' && 600 || 1 }}

  test:
    name: test (ubuntu)
    runs-on: ubuntu-26.04
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    steps:
    - run: echo "probe"

  e2e-dev:
    name: e2e against the development build (ubuntu)
    runs-on: ubuntu-26.04
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    steps:
    - run: echo "probe"
