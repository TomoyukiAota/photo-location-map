name: CI on Ubuntu

on:
  push:
    branches:
      - '**'    # matches every branch
  # No pull_request trigger: each commit is tested by its push run alone, and a pull request from a fork by
  # ci-on-fork-pull-request.yml, which calls this workflow (AGENTS.md, "CI tests each commit once, on push").
  workflow_call:

# A new commit on a branch cancels the runs of the commit before it, so that only the latest commit is tested when
# Mergify brings a pull request up to date with main (.mergify.yml). Each run on main has a group of its own, and is
# never canceled. The group names this workflow itself rather than github.workflow, which is the caller's name when
# ci-on-fork-pull-request.yml calls it, so that the three workflows that it calls do not share one.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && github.run_id || format('CI on Ubuntu {0} {1}', github.event_name, github.event.pull_request.number || github.ref_name) }}
  cancel-in-progress: true

jobs:
  changes:
    # Finds out whether anything other than documents changed (see .github/ci-filters.yml).
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
    - uses: actions/checkout@v7.0.1

    - uses: dorny/paths-filter@v4.0.3
      id: filter
      with:
        predicate-quantifier: every
        filters: .github/ci-filters.yml

  part-1:
    # TL;DR: The tests on Ubuntu, in two parts that run at once, each on a runner of its own. Each part makes the
    # AppImage and runs half of the e2e suite against it; part 1 also runs the checks and the unit tests. The job "test"
    # below reports both as the required check "test (ubuntu)". e2e-dev runs the suite against a development build.
    # Details: In one job, the e2e suite took about 11 minutes after about 4 for the rest. PLM_E2E_SHARD names the half
    # of the suite (test/e2e/playwright.config.mjs), and PLM_CI_PART leaves out of part 2 what part 1 runs alone.
    # The names are written out rather than given by a matrix or an expression, so that the checks are reported even
    # when the jobs are skipped: a skipped job's name expression is not evaluated.
    # Keep the required-check name stable when the Ubuntu runner version changes.
    name: test (ubuntu), part 1 of 2
    runs-on: ubuntu-26.04

    # Skipped when only documents changed. If "changes" fails, the tests run.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}

    # The timeout below is a preventative measure to bound the duration of a hung job.
    # This job usually takes about 10 minutes, so the timeout below has enough margin.
    timeout-minutes: 30

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # for electron-builder
      ELECTRON_DISABLE_SANDBOX: '1'
      PLM_CI_PART: '1'
      PLM_E2E_SHARD: '1/2'

    steps: &steps
    - uses: actions/checkout@v7.0.1

    - name: Install Node.js with the version in mise.toml
      uses: jdx/mise-action@v5.2.5

    - name: Verify Node and its bundled npm
      run: npm run verify:runtime

    - name: npm ci
      run: npm ci

    - name: Verify Electron and embedded Node
      run: npm run verify:electron

    - name: npm run test:dependency-compat
      if: ${{ env.PLM_CI_PART != '2' }}    # In part 1 only, as are the other steps with this condition.
      run: npm run test:dependency-compat

    - name: npm run test:website
      if: ${{ env.PLM_CI_PART != '2' }}
      run: npm run test:website

    - name: Install virtual display dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb x11-xserver-utils

    - name: npm run lint:ng
      if: ${{ env.PLM_CI_PART != '2' }}
      run: npm run lint:ng

    - name: npm run lint:main
      if: ${{ env.PLM_CI_PART != '2' }}
      run: npm run lint:main

    - name: npm run lint:script
      if: ${{ env.PLM_CI_PART != '2' }}
      run: npm run lint:script

    - name: npm run test:unit:ng
      if: ${{ env.PLM_CI_PART != '2' }}
      run: xvfb-run --auto-servernum npm run test:unit:ng

    - name: npm run test:unit:em:main
      if: ${{ env.PLM_CI_PART != '2' }}
      run: xvfb-run --auto-servernum npm run test:unit:em:main

    - name: npm run test:unit:em:renderer
      if: ${{ env.PLM_CI_PART != '2' }}
      run: xvfb-run --auto-servernum npm run test:unit:em:renderer

    - name: npm run test:live-reload
      if: ${{ env.PLM_CI_PART != '2' }}
      run: xvfb-run --auto-servernum npm run test:live-reload

    - name: Install FUSE (Required to launch AppImage during "npm run test:package")
      run: |
        sudo apt-get update
        sudo apt-get install -y libfuse2t64

    - name: npm run test:package
      run: xvfb-run --auto-servernum npm run test:package

    - name: Make an AppImage for E2E
      # Of a copy of the package whose fuse enableNodeCliInspectArguments is on: Playwright controls the application
      # through Node's inspector, which the package does not start (script/package-test/inspectable-package.js).
      run: |
        executable="$(node script/package-test/inspectable-package.js)"
        echo "PLM_PACKAGED_EXECUTABLE=$executable" >> "$GITHUB_ENV"

    - name: npm run test:e2e
      run: xvfb-run --auto-servernum npm run test:e2e

# Uncomment the lines below to publish Linux package to GitHub Releases, in part 2 only, as the Windows CI does:
# give each step "if: ${{ env.PLM_CI_PART != '1' }}".
#
#    - name: '[Publish to GitHub Releases] Clean-up by "git clean -fdx" (1st time)'
#      run: git clean -fdx
#
#    - name: '[Publish to GitHub Releases] Clean-up by "git clean -fdx" (2nd time to be sure)'
#      run: git clean -fdx
#
#    - name: '[Publish to GitHub Releases] npm ci'
#      run: npm ci
#
#    - name: '[Publish to GitHub Releases] Create and publish Linux package'
#      uses: nick-fields/retry@v4.0.0
#      with:
#        timeout_minutes: 60
#        max_attempts: 10
#        retry_on: error
#        command: npm run publish:linux      # To publish, GH_TOKEN environment variable needs to be set.

  part-2:
    # See part-1.
    name: test (ubuntu), part 2 of 2
    runs-on: ubuntu-26.04
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    timeout-minutes: 30    # See part-1.
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # for electron-builder
      ELECTRON_DISABLE_SANDBOX: '1'
      PLM_CI_PART: '2'
      PLM_E2E_SHARD: '2/2'
    steps: *steps

  test:
    # The required check of Ubuntu: it passes when both parts passed. When only documents changed, it is skipped with
    # them, which passes the check too. e2e-dev reports a required check of its own.
    name: test (ubuntu)
    runs-on: ubuntu-26.04
    needs: [changes, part-1, part-2]
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    timeout-minutes: 5
    steps:
    - name: Check that both parts passed
      run: |
        echo "Part 1 of 2: ${{ needs.part-1.result }}. Part 2 of 2: ${{ needs.part-2.result }}."
        if [ "${{ needs.part-1.result }}" != success ] || [ "${{ needs.part-2.result }}" != success ]; then
          echo "::error::Read the log of the part that did not pass, which is a job of its own in this run."
          exit 1
        fi

  e2e-dev:
    # TL;DR: The e2e suite against a development build of the checkout, beside part-1 and part-2, which run it against
    # the AppImage, a production build. The runs of the suite take place at the same time.
    # Details: A development build checks every view each second for a binding that changed without telling Angular,
    # which would not be rendered, and the suite fails a case that logged one, as NG0100 (test/e2e/README.md). A
    # production build checks nothing. Run against the checkout, the suite also has the cases of the website, which it
    # skips for a package. This run took about 9 minutes after the AppImage's in "test", which made that job the
    # longest of CI's, about 24 minutes against about 20 for macOS and Windows.
    # The name is written out rather than given by a matrix or an expression, so that the check is reported even when
    # the job is skipped: a skipped job's name expression is not evaluated.
    name: e2e against the development build (ubuntu)
    runs-on: ubuntu-26.04

    # Skipped when only documents changed, as "test" is, which passes the check. If "changes" fails, the tests run.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}

    # To bound the duration of a hung job. This job usually takes about 12 minutes.
    timeout-minutes: 30

    env:
      ELECTRON_DISABLE_SANDBOX: '1'

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Install Node.js with the version in mise.toml
      uses: jdx/mise-action@v5.2.5

    - name: npm ci
      run: npm ci

    - name: Install virtual display dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb x11-xserver-utils

    - name: npm run build:dev
      run: npm run build:dev

    - name: npm run test:e2e against the development build
      run: xvfb-run --auto-servernum npm run test:e2e
