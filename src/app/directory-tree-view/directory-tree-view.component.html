<!--
  The name of a file or a folder is in a bdi element: on its own in its row, and written from the side that its first
  letter says, so that a name in Latin letters keeps its order in a language written from right to left, and a name in
  Arabic or Hebrew letters in the others.
-->
<mat-tree #tree="matTree" [dataSource]="treeData()" [childrenAccessor]="childrenAccessor">
  <!--
    A file's row, which a revealed photo highlights for a moment, by an attribute set on the row rather than bound
    here (RevealHighlights). It makes what is costly in it, a photo's checkbox and the photo's thumbnail and buttons,
    only once it comes near the part of the tree that is shown (appNearView), as an expanded folder can have thousands
    of rows. The components inside the row read whether it is near, and how much of the selection is theirs, in their
    own templates: this template must not (see NearViewDirective).
    It has no matTreeNodeToggle, which a folder's button has: a click on the row, a click on its checkbox too, would
    expand or collapse the file in the tree's state, which shows nothing for a file but has the tree go through all of
    its nodes again and check every row (docs/tasks/20261119_checkbox-checks-changed-rows/STATUS.md).
  -->
  <mat-tree-node *matTreeNodeDef="let node"
                 matTreeNodePadding
                 [matTreeNodePaddingIndent]="indentPerLevel"
                 (contextmenu)="onContextMenu($event, node)"
                 appNearView
                 class="leaf-tree-node">
    <app-dir-tree-view-checkbox-and-name [node]="node" (toggled)="handleCheckboxChange(node)" />
    @if (photoOf(node); as photo) {
      <app-photo-info-viewer place="dir-tree-view" [photo]="photo" />
    }
  </mat-tree-node>

  <mat-tree-node *matTreeNodeDef="let node; when: hasChildren"
                 isExpandable
                 matTreeNodePadding
                 [matTreeNodePaddingIndent]="indentPerLevel"
                 (contextmenu)="onContextMenu($event, node)"
                 [title]="isOpenedFolder(node) ? ('directoryTree.openedFolder' | t: { path: node.path }) : ''">
    <button mat-icon-button matTreeNodeToggle>
      <mat-icon class="mat-icon-rtl-mirror">
        {{tree.isExpanded(node) ? 'expand_more' : 'chevron_right'}}
      </mat-icon>
    </button>
    <app-dir-tree-view-folder-checkbox-and-name [node]="node" (toggled)="handleCheckboxChange(node)" />
  </mat-tree-node>
</mat-tree>

<!--#region Context Menu -->
<div style="visibility: hidden; position: fixed"
     [style.left]="contextMenuPosition.x"
     [style.top]="contextMenuPosition.y"
     [matMenuTriggerFor]="contextMenu">
</div>
<mat-menu #contextMenu="matMenu">
  <ng-template matMenuContent let-data="contextMenuData">
    @for (menuItem of contextMenuItems; track menuItem) {
      @if (menuItem.visible(data)) {
        <button mat-menu-item class="context-menu-button" (click)="menuItem.onClick(data, injector)">{{ menuItem.textKey(data) | t }}</button>
      }
    }
  </ng-template>
</mat-menu>
<!--#endregion Context Menu -->
