<div class="setting-title">{{ 'settings.os.title' | t }}</div>
<div class="setting-container">
  <div class="description">
    {{ 'settings.os.description' | t: { menuItem } }}
  </div>
  <div class="buttons">
    <button mat-stroked-button (click)="handleAddButtonClicked()">
      {{ 'settings.os.add' | t }}
    </button>
    <button mat-stroked-button (click)="handleRemoveButtonClicked()">
      {{ 'settings.os.remove' | t }}
    </button>
  </div>
  <div class="message-after-button-clicked">
    @for (line of messageLinesAfterButtonClicked(); track line) {
        <div>{{ line }}</div>
    }
  </div>
</div>
