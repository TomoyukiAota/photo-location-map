<div class="message">{{ data.message }}</div>
@if (data.path) {
  <div class="path"><bdi>{{ data.path }}</bdi></div>
}
<div class="buttons">
  <button mat-flat-button
          color="primary"
          class="ok-button"
          [mat-dialog-close]="true">
    {{ 'common.ok' | t }}
  </button>
  <button mat-button
          class="cancel-button"
          [mat-dialog-close]="false">
    {{ 'common.cancel' | t }}
  </button>
</div>
