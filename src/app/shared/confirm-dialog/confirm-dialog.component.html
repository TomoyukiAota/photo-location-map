<div class="message" [attr.lang]="textLanguage" [attr.dir]="textDirection">{{ data.message }}</div>
@if (data.path) {
  <div class="path"><bdi>{{ data.path }}</bdi></div>
}
<div class="buttons">
  <button mat-flat-button
          color="primary"
          class="ok-button"
          [attr.lang]="textLanguage"
          [attr.dir]="textDirection"
          [mat-dialog-close]="true">
    {{ okLabel }}
  </button>
  <button mat-button
          class="cancel-button"
          [attr.lang]="textLanguage"
          [attr.dir]="textDirection"
          [mat-dialog-close]="false">
    {{ cancelLabel }}
  </button>
</div>
