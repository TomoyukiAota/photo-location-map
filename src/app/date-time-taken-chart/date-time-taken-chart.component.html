<div class="chart-container">
  <div echarts
       [options]="eChartsOption()"
       (chartInit)="onChartInit($event)"
       (chartDataZoom)="onChartDataZoom()"
       (chartRestore)="onChartRestore()"
       class="chart">
  </div>
  @if (!isSupportedDuration()) {
    <div class="unsupported-overlay">
      <div class="unsupported-message">
        {{ 'chart.unsupportedDuration' | t }}<br>
        {{ 'chart.changeUnitOrSelection' | t }}
      </div>
    </div>
  }
</div>
<div class="sidebar">
  <app-date-time-taken-chart-config class="config"
                                    (showDateUnknownPhotosChange)="onShowDateUnknownPhotosChanged($event)"
                                    (xAxisUnitChange)="onXAxisUnitChanged($event)">
  </app-date-time-taken-chart-config>
  @if (isSelectPhotosWithinZoomButtonVisible()) {
    <app-select-photos-within-zoom class="select-photos-within-zoom"></app-select-photos-within-zoom>
  }
</div>
