<!--
  Each gutter is Split.js's, which it takes from here rather than making one, so that a double-click on it can put its
  panes back to their default sizes (pane-sizes/pane-split.ts).
-->
<div class="sidebar-and-map-container">
  <div id="home-left-sidebar" #sidebar>
    <div id="home-sidebar-upper-pane" #sidebarUpperPane>
      <app-sidebar-upper-pane></app-sidebar-upper-pane>
    </div>
    <div class="gutter gutter-vertical" #sidebarPanesGutter (dblclick)="resetSidebarUpperPaneHeight()"></div>
    <!--
      A row that the keyboard focuses is scrolled into view below the rows that the folder tree keeps at its top,
      rather than under them (DirTreeViewStickyRowsComponent).
    -->
    <div id="home-sidebar-lower-pane" #sidebarLowerPane [style.scroll-padding-top.px]="stickyRowsService.coveredHeight()">
      <app-sidebar-lower-pane></app-sidebar-lower-pane>
    </div>
  </div>
  <div class="gutter gutter-horizontal" #sidebarGutter (dblclick)="resetSidebarWidth()"></div>
  <div id="home-right" #right>
    <div id="home-map" #map>
      <app-leaflet-map></app-leaflet-map>
    </div>
    <div class="gutter gutter-vertical" #mapGutter (dblclick)="resetChartHeight()"></div>
    <div id="home-chart" #chart>
      <app-date-time-taken-chart></app-date-time-taken-chart>
    </div>
  </div>
</div>
<app-thumbnail-generation-status-bar [class.hidden]="!thumbnailGenerationStatusBarService.visible()">
</app-thumbnail-generation-status-bar>
<app-loaded-files-status-bar [class.hidden]="!loadedFilesStatusBarService.visible()">
</app-loaded-files-status-bar>
<!-- The menu of every photo's More Options button, in the tree and on the map. -->
<app-photo-info-viewer-more-options-menu />
