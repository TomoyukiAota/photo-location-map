<div class="language-dialog-title" id="language-dialog-title">{{ 'language.title' | t }}</div>
<app-language-list class="language-list" [(selected)]="selected"></app-language-list>
<div class="restart-room">
  <!-- Gives the room its height: the note in the language on screen, which is not shown nor read aloud. -->
  <div class="restart-room-height" aria-hidden="true">{{ restartNoteOnScreen }}</div>
  <div class="restart-note-place">
    <div class="restart-note"
         [style.visibility]="isRestartRequired() ? 'visible' : 'hidden'"
         [attr.lang]="selectedLanguage()"
         [attr.dir]="selectedDirection()">
      {{ restartNote() }}
    </div>
  </div>
</div>
<button mat-flat-button
        color="primary"
        class="ok-button"
        [attr.lang]="selectedLanguage()"
        [attr.dir]="selectedDirection()"
        [disabled]="isSaving()"
        (click)="onOkClicked()">
  {{ confirmLabel() }}
</button>
