@let loaded = summary();
@if (loaded.numberOfLoadedFiles >= 1) {
  <div class='message-container'>
    <div class="left-message-container">
      <span>Loaded {{ loaded.numberOfLoadedFiles }} files.</span>
      <span>{{ loaded.numberOfFilesWithGpsInfo }} files have location data.</span>
    </div>
    <div class="right-message-container">
      <span>{{ loaded.descriptionByFileType }}</span>
    </div>
  </div>
}
