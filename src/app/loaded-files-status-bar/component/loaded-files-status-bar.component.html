@let loaded = summary();
@if (loaded.numberOfLoadedFiles >= 1) {
  <div class='message-container'>
    <div class="left-message-container">
      <span>{{ 'loadedFiles.loaded' | t: { count: loaded.numberOfLoadedFiles } }}</span>
      <span>{{ 'loadedFiles.withLocationData' | t: { count: loaded.numberOfFilesWithGpsInfo } }}</span>
    </div>
    <div class="right-message-container">
      <span>{{ loaded.descriptionByFileType }}</span>
    </div>
  </div>
}
