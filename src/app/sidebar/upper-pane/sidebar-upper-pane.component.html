<div class="container">
  <div class="open-folder-button">
    <button mat-stroked-button
            [disabled]="thumbnailGenerationService.isGenerating()"
            [title]="thumbnailGenerationService.isGenerating() ? ('sidebar.cannotOpenWhileGeneratingThumbnails' | t) : ''"
            (click)="showOpenFolderDialog()">
      {{ 'sidebar.openFolder' | t }}
    </button>
  </div>
  <app-sidebar-upper-pane-more-options></app-sidebar-upper-pane-more-options>
</div>
