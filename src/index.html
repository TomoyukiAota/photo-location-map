<!doctype html>
<!-- The main process writes the application's language and direction here, and the loading text in that language
     below, as it serves this page (src-main/file-server/app-page-language.ts). In live reload, ng serve sends the page
     as it is, in English until src/start-app.ts sets its language. -->
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <title>Photo Location Map</title>
  <base href="">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- Leaflet, Leaflet.markercluster and Leaflet-Geoman are bundled from node_modules by "styles" and "scripts" in
       angular.json, not loaded from a CDN, so that the map starts without the network. -->

</head>
<body>
  <app-root>
    <div class="app-loading-indicator-container" role="status">
      <span class="app-loading-indicator" aria-hidden="true"></span>
      <span class="app-loading-text" id="app-loading-text">Loading...</span>
    </div>
  </app-root>
</body>
</html>
