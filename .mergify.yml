pull_request_rules:
  - name: automatic merge on CI success
    conditions:
      # Each test job is skipped when only documents changed (see .github/ci-filters.yml).
      - or:
        - check-success=test (ubuntu)
        - check-skipped=test (ubuntu)
      - or:
        - check-success=test (windows-latest)
        - check-skipped=test (windows-latest)
      - or:
        - check-success=test (macos-arm64)
        - check-skipped=test (macos-arm64)
      - label=automerge
      - author=TomoyukiAota
    actions:
      merge:
        method: merge
